<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badass Studio - AI Voice Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================
                   RESET & BASE STYLES
                   ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0e27, #1a1a3e, #0d1b2a);
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ============================================
                   CONTAINER
                   ============================================ */
        .container {
            max-width: 950px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        /* ============================================
                   HEADER
                   ============================================ */
        header {
            margin-bottom: 30px;
            text-align: center;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .logo-icon {
            font-size: 40px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .logo h1 {
            font-size: 38px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff006e, #ff6b6b, #ff006e);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease-in-out infinite;
            letter-spacing: -1px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .subtitle span {
            color: #ff006e;
            font-weight: 600;
        }

        /* ============================================
                   AD CONTAINERS
                   ============================================ */
        .ad-box {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
            text-align: center;
        }

        iframe.ad-iframe {
            width: 100%;
            height: 90px;
            border: none;
            background: transparent;
        }

        /* ============================================
                   GENERATOR CONTAINER
                   ============================================ */
        .generator-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ============================================
                   INPUT SECTION
                   ============================================ */
        .input-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .text-input-wrapper {
            position: relative;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: rgba(255, 255, 255, 0.7);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .toolbar-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .char-count {
            margin-left: auto;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #ffffff;
            padding: 16px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            line-height: 1.8;
            resize: vertical;
            transition: all 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #ff006e;
            box-shadow: 0 0 0 3px rgba(255, 0, 110, 0.15);
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        /* ============================================
                   CONTROLS SECTION
                   ============================================ */
        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-group label {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ============================================
                   VOICE SELECT
                   ============================================ */
        .voice-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            padding: 12px 16px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            max-height: 300px;
        }

        .voice-select:hover,
        .voice-select:focus {
            border-color: #ff006e;
            outline: none;
            background: rgba(255, 255, 255, 0.08);
        }

        .voice-select option {
            background: #1a1a3e;
            color: #ffffff;
            padding: 8px;
        }

        .voice-select optgroup {
            background: #0d1b2a;
            color: #ff006e;
            font-weight: 600;
        }

        /* ============================================
                   STYLE BUTTONS
                   ============================================ */
        .style-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .style-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.7);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .style-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .style-btn.active {
            background: linear-gradient(135deg, #ff006e, #ff6b6b);
            border-color: transparent;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(255, 0, 110, 0.3);
            transform: translateY(-2px);
        }

        /* ============================================
                   SLIDER CONTROLS
                   ============================================ */
        .slider-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .slider-item {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .slider-item span:first-child {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            min-width: 60px;
            font-weight: 500;
        }

        .slider-item input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
            transition: all 0.3s;
        }

        .slider-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff006e, #ff6b6b);
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(255, 0, 110, 0.3);
        }

        .slider-item input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.5);
        }

        .slider-item input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff006e, #ff6b6b);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(255, 0, 110, 0.3);
        }

        .slider-value {
            font-size: 13px;
            font-weight: 600;
            color: #ff006e;
            min-width: 40px;
            text-align: right;
        }

        /* ============================================
                   GENERATE BUTTON (Smart Link + Multi-Click)
                   ============================================ */
        .generate-btn {
            background: linear-gradient(135deg, #ff006e 0%, #ff6b6b 100%);
            border: none;
            color: #ffffff;
            padding: 18px 32px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 8px 30px rgba(255, 0, 110, 0.3);
            position: relative;
            overflow: hidden;
            width: 100%;
            text-decoration: none;
        }

        .generate-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .generate-btn:hover:not(:disabled)::before {
            left: 100%;
        }

        .generate-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(255, 0, 110, 0.5);
        }

        .generate-btn:active:not(:disabled) {
            transform: translateY(0px);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-icon {
            font-size: 20px;
        }

        /* ============================================
                   OUTPUT SECTION
                   ============================================ */
        .output-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: slideUp 0.5s ease;
            display: none;
            margin-top: 20px;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================
                   AUDIO PLAYER
                   ============================================ */
        .audio-player {
            margin-bottom: 16px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .play-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #ff006e, #ff6b6b);
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(255, 0, 110, 0.3);
        }

        .play-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 25px rgba(255, 0, 110, 0.5);
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        .progress-bar {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            transition: height 0.3s;
        }

        .progress-bar:hover {
            height: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff006e, #ff6b6b);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s;
        }

        .time-display {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            min-width: 100px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        .download-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
        }

        .download-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        /* ============================================
                   ACTION BUTTONS
                   ============================================ */
        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.7);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
            font-weight: 500;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* ============================================
                   TOAST NOTIFICATION
                   ============================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 110, 0.95);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 9999;
            animation: slideUp 0.3s ease;
            max-width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .toast.error {
            background: rgba(255, 50, 50, 0.95);
        }

        .toast.success {
            background: rgba(255, 0, 110, 0.95);
        }

        /* ============================================
                   RESPONSIVE
                   ============================================ */
        @media (max-width: 768px) {
            .container { padding: 20px; }
            .logo h1 { font-size: 28px; }
            .style-buttons { gap: 6px; }
            .style-btn { font-size: 12px; padding: 6px 12px; }
            .player-controls { flex-wrap: wrap; }
            .time-display { min-width: 80px; font-size: 12px; }
            .generate-btn { font-size: 16px; padding: 16px 24px; }
            textarea { min-height: 120px; font-size: 15px; }
            .slider-item { gap: 10px; }
            .slider-item span:first-child { min-width: 50px; font-size: 13px; }
        }

        @media (max-width: 480px) {
            .container { padding: 12px; }
            .logo h1 { font-size: 24px; }
            .logo-icon { font-size: 32px; }
            .controls-section { padding: 16px; }
            .action-buttons { gap: 8px; }
            .action-btn { font-size: 12px; padding: 6px 14px; }
            .toolbar { gap: 6px; }
            .toolbar-btn { padding: 4px 8px; font-size: 12px; }
        }
    </style>

                                <div class="progress-fill" id="progressFill"></div>
                            </div>
                            <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
                            <button onclick="downloadAudio()" class="download-btn">⬇ Download</button>
                        </div>
                        <audio id="audioPlayer" style="display: none;"></audio>
                    </div>

                    <div class="action-buttons">
                        <button onclick="regenerateAudio()" class="action-btn">🔄 Regenerate</button>
                        <button onclick="shareAudio()" class="action-btn">📤 Share</button>
                    </div>
                </div>

            </div>
        </main>

        <!-- ========== FOOTER ========== -->
        <footer style="margin-top: 30px; text-align: center;">
            <p style="font-size: 13px; color: rgba(255, 255, 255, 0.15); letter-spacing: 0.5px;">
                🔥 Badass Studio • Free & Open Source • No API Key Required
            </p>
        </footer>
    </div>

    <!-- ==========================================
    JAVASCRIPT - Badass Studio (Merged & Upgraded)
    ========================================== -->
    <script>
        /**
         * ============================================
         * BADASS STUDIO - Complete JavaScript
         * 100% Edge TTS Based
         * With Simplified Roman Urdu Support
         * Smart Link + Multi-Click Ad Integration
         * ============================================
         */

        // ============= SMART LINK CONFIG =============
        const SMART_LINK = "https://www.effectivecpmnetwork.com/xxzz1j2s?key=18168874abae8f6e106244faf40552cd";
        let clickCount = 0;

        // ============= STATE =============
        let currentAudioUrl = '';
        let currentFilename = '';

        // ============= SAMPLE TEXTS =============
        const SAMPLES = {
            'ur-PK-UzmaNeural': 'السلام علیکم! میں عظمیٰ ہوں۔ میں اردو میں بات کر سکتی ہوں۔',
            'ur-PK-AsadNeural': 'السلام علیکم! میں اسد ہوں۔ میں اردو میں بول سکتا ہوں۔',
            'en-US-JennyNeural': 'Hi there! This is Jenny. I can speak with natural intonation and expression.',
            'en-US-GuyNeural': 'Hello! I am Guy. I speak clearly and confidently.',
            'hi-IN-SwaraNeural': 'नमस्ते! मैं स्वरा हूँ। मैं हिंदी में बात कर सकती हूँ।',
            'hi-IN-MadhurNeural': 'नमस्ते! मैं मधुर हूँ। मैं हिंदी में बोल सकता हूँ।',
            'en-GB-SoniaNeural': 'Good day! I am Sonia, speaking with a lovely British accent.'
        };

        // ============= SIMPLIFIED ROMAN URDU SAMPLES =============
        const ROMAN_URDU_SAMPLES = [
            'Assalam o Alaikum! Mera naam Uzma hai. Main Roman Urdu mein baat kar sakti hoon.',
            'Yeh Badass Studio hai. Yahan aap Roman Urdu mein likh kar awaz bana sakte hain.',
            'Pakistan ka yeh pehla platform hai jo Roman Urdu ko support karta hai.',
            'Aap is mein koi bhi text Roman Urdu mein likh sakte hain aur awaz sun sakte hain.',
            'Bohat shukriya! Badass Studio use karne ke liye. Umeed hai aap ko pasand aaye ga.',
            'Main rozana Roman Urdu mein likhti hoon. Yeh meri pehli pasand hai.',
            'Badass Studio ki madad se main apni awaz records kar sakta hoon.'
        ];

        // ============= TEXT MANAGEMENT =============

        /** Update character count */
        function updateCharCount() {
            const text = document.getElementById('textInput').value;
            document.getElementById('charCount').textContent = `${text.length} / 5000`;
        }

        /** Load sample text based on selected voice */
        function loadSample() {
            const voice = document.getElementById('voiceSelect').value;
            const sample = SAMPLES[voice] || SAMPLES['en-US-JennyNeural'];
            document.getElementById('textInput').value = sample;
            updateCharCount();
            showToast('✅ Sample text loaded');
        }

        /** Load simplified Roman Urdu sample */
        function loadRomanUrduSample() {
            const randomIndex = Math.floor(Math.random() * ROMAN_URDU_SAMPLES.length);
            const sample = ROMAN_URDU_SAMPLES[randomIndex];
            document.getElementById('textInput').value = sample;
            updateCharCount();

            // Auto-select Urdu voice
            const voiceSelect = document.getElementById('voiceSelect');
            const urduVoices = ['ur-PK-UzmaNeural', 'ur-PK-AsadNeural'];
            const currentVoice = voiceSelect.value;
            if (!urduVoices.includes(currentVoice)) {
                voiceSelect.value = 'ur-PK-UzmaNeural';
            }

            showToast('🇵🇰 Roman Urdu sample loaded!');
        }

        /** Clear text input */
        function clearText() {
            document.getElementById('textInput').value = '';
            updateCharCount();
            showToast('🗑️ Text cleared');
        }

        /** Paste text from clipboard */
        async function pasteText() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('textInput').value = text;
                updateCharCount();
                showToast('📋 Text pasted successfully!');
            } catch (err) {
                console.error('Failed to paste:', err);
                showToast('❌ Unable to paste. Please use Ctrl+V manually.', 'error');
            }
        }

        // ============= STYLE SELECTION =============

        /** Select voice style */
        function selectStyle(btn) {
            document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // ============= SLIDER CONTROLS =============

        /** Update slider display values */
        function updateSliderValue(type) {
            if (type === 'rate') {
                const value = document.getElementById('rateSlider').value;
                document.getElementById('rateValue').textContent = `${value}%`;
            } else if (type === 'pitch') {
                const value = document.getElementById('pitchSlider').value;
                document.getElementById('pitchValue').textContent = `${value}Hz`;
            } else if (type === 'volume') {
                const value = document.getElementById('volumeSlider').value;
                document.getElementById('volumeValue').textContent = `${value}%`;
            }
        }

        // ============= TOAST NOTIFICATION =============

        /** Show toast notification */
        function showToast(message, type = 'success') {
            const existingToast = document.querySelector('.toast');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // ============= SMART LINK + MULTI-CLICK AD LOGIC =============

        /**
         * Handle Generate Button Click
         * First click: Opens Smart Link (Ad) + starts generation
         * Every click: Opens Smart Link again + triggers voice generation
         * This ensures ad revenue while keeping UX smooth
         */
        function handleGenerateClick() {
            const text = document.getElementById('textInput').value.trim();
            if (!text) {
                showToast('❌ Please enter some text first!', 'error');
                return;
            }

            clickCount++;

            // Always open Smart Link in new tab (ad monetization)
            window.open(SMART_LINK, '_blank');

            // Generate speech every time (user gets their voice immediately)
            generateSpeech();

            // Reset counter occasionally to keep the flow
            if (clickCount > 5) {
                clickCount = 0;
            }
        }

        // ============= AUDIO GENERATION (Edge TTS) =============

        /** Generate speech using Edge TTS API */
        async function generateSpeech() {
            const text = document.getElementById('textInput').value.trim();
            const voice = document.getElementById('voiceSelect').value;
            const rate = document.getElementById('rateSlider').value;
            const pitch = document.getElementById('pitchSlider').value;
            const styleBtn = document.querySelector('.style-btn.active');
            const style = styleBtn ? styleBtn.dataset.style : 'neutral';

            const generateBtn = document.getElementById('generateBtn');
            const originalText = generateBtn.innerHTML;
            generateBtn.disabled = true;
            generateBtn.innerHTML = '<span class="btn-icon">⏳</span> Generating...';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: text,
                        voice: voice,
                        rate: `${rate}%`,
                        pitch: `${pitch}Hz`,
                        style: style
                    })
                });

                const data = await response.json();

                if (data.success) {
                    currentAudioUrl = data.audio_url;
                    currentFilename = data.filename;

                    const audio = document.getElementById('audioPlayer');
                    audio.src = currentAudioUrl;
                    audio.load();

                    const outputSection = document.getElementById('outputSection');
                    outputSection.style.display = 'block';
                    outputSection.style.animation = 'none';
                    setTimeout(() => {
                        outputSection.style.animation = 'slideUp 0.5s ease';
                    }, 10);

                    audio.play().catch(() => {});
                    document.getElementById('playBtn').innerHTML = '⏸';

                    audio.addEventListener('timeupdate', updateProgress);
                    audio.addEventListener('loadedmetadata', updateTimeDisplay);
                    audio.addEventListener('ended', () => {
                        document.getElementById('playBtn').innerHTML = '▶';
                    });

                    showToast('✅ Voice generated successfully!');
                } else {
                    showToast('Error: ' + data.error, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('❌ Error generating voice', 'error');
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerHTML = originalText;
            }
        }

        // ============= AUDIO CONTROLS =============

        /** Play/Pause audio */
        function playAudio() {
            const audio = document.getElementById('audioPlayer');
            const playBtn = document.getElementById('playBtn');

            if (audio.paused) {
                audio.play();
                playBtn.innerHTML = '⏸';
            } else {
                audio.pause();
                playBtn.innerHTML = '▶';
            }
        }

        /** Update progress bar */
        function updateProgress() {
            const audio = document.getElementById('audioPlayer');
            const progressFill = document.getElementById('progressFill');
            if (audio.duration && !isNaN(audio.duration)) {
                const progress = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = progress + '%';
            }
            updateTimeDisplay();
        }

        /** Update time display */
        function updateTimeDisplay() {
            const audio = document.getElementById('audioPlayer');
            const timeDisplay = document.getElementById('timeDisplay');
            if (audio.duration && !isNaN(audio.duration)) {
                const current = formatTime(audio.currentTime);
                const duration = formatTime(audio.duration);
                timeDisplay.textContent = `${current} / ${duration}`;
            }
        }

        /** Format time in MM:SS */
        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds) || seconds < 0) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        /** Seek audio on progress bar click */
        function seekAudio(event) {
            const audio = document.getElementById('audioPlayer');
            const progressBar = event.currentTarget;
            const rect = progressBar.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const percentage = Math.max(0, Math.min(1, x / rect.width));
            if (audio.duration && !isNaN(audio.duration)) {
                audio.currentTime = percentage * audio.duration;
            }
        }

        /** Download audio file */
        function downloadAudio() {
            if (currentAudioUrl) {
                const link = document.createElement('a');
                link.href = currentAudioUrl;
                link.download = `badass_voice_${Date.now()}.mp3`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('📥 Download started!');
            } else {
                showToast('No audio to download. Please generate voice first.', 'error');
            }
        }

        /** Regenerate audio */
        function regenerateAudio() {
            generateSpeech();
        }

        /** Share audio */
        function shareAudio() {
            if (currentAudioUrl) {
                if (navigator.share) {
                    navigator.share({
                        title: 'Badass Studio Voice',
                        text: 'Check out this AI-generated voice from Badass Studio!',
                        url: window.location.origin + currentAudioUrl
                    }).catch(console.error);
                } else {
                    const url = window.location.origin + currentAudioUrl;
                    navigator.clipboard.writeText(url).then(() => {
                        showToast('📋 Audio URL copied!');
                    }).catch(() => {
                        showToast('URL: ' + url);
                    });
                }
            } else {
                showToast('No audio to share. Please generate voice first.', 'error');
            }
        }

        // ============= KEYBOARD SHORTCUTS =============

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                e.preventDefault();
                const textarea = document.getElementById('textInput');
                if (document.activeElement === textarea) {
                    handleGenerateClick();
                }
            }
            if (e.key === 'Escape') {
                const audio = document.getElementById('audioPlayer');
                if (!audio.paused) {
                    audio.pause();
                    document.getElementById('playBtn').innerHTML = '▶';
                }
            }
            if (e.key === ' ' && document.activeElement !== document.getElementById('textInput')) {
                e.preventDefault();
                playAudio();
            }
        });

        // ============= INITIALIZATION =============

        document.addEventListener('DOMContentLoaded', function() {
            updateCharCount();
            if (!document.getElementById('textInput').value) {
                loadRomanUrduSample();
            }
            console.log('🔥 Badass Studio initialized!');
            console.log('🎙️ Powered by Edge Neural TTS');
            console.log('🇵🇰 Roman Urdu Support Enabled');
            console.log('💡 Press Ctrl+Enter to generate voice');
            console.log('🔗 Smart Link enabled: ' + SMART_LINK);
            console.log('💰 Multi-Click Ad Integration Active');
        });
    </script>

</body>
</html>
